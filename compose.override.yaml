---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - /app/var
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      # Reinicia o worker só quando muda algo que exige um kernel novo. O padrão do "watch" incluiria
      # var/cache/, e cada template compilado pelo Twig reiniciaria todas as threads (ADR 0011).
      # Templates não precisam: o Twig recompila sozinho em dev.
      FRANKENPHP_WORKER_CONFIG: |
        watch ./src/**/*.php
        watch ./config/**/*.{php,yaml,yml}
        watch ./.env*
        watch ./composer.lock
      FRANKENPHP_SITE_CONFIG: hot_reload
      MERCURE_EXTRA_DIRECTIVES: playground
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
    # Na primeira subida o entrypoint roda o composer install (vendor/ vazio), que no Mac/Windows passa dos
    # 60 s de tolerância da imagem e fazia o "up --wait" acusar unhealthy. O teste continua o da imagem.
    healthcheck:
      start_period: 15m
      start_interval: 5s
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
###< doctrine/doctrine-bundle ###

  # Compila o front-end com o Encore (ADR 0015). Não sobe com "docker compose up": roda sob demanda,
  # com "docker compose run --rm node npm ...". Mesma versão fixada do estágio assets_builder do Dockerfile.
  node:
    image: node:24.22.2-alpine@sha256:a34ab6d7f6f4813f4d0c5469d74685604b962fbdbf5793a7bc7b4998ecb867c8
    profiles: [tools]
    working_dir: /app
    volumes:
      - ./:/app
      # node_modules num volume, fora do bind mount: mais rápido no Mac/Windows e não aparece no host.
      - node_modules:/app/node_modules

volumes:
  node_modules:

